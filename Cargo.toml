[package]
name = "npnp"
version = "3.1.0"
edition = "2024"
autobins = false
authors = ["ref42 <ybinlew@gmail.com>"]
description = "Normalize Pin Net Pad (npnp): pure Rust LCEDA/EasyEDA downloader and Altium/KiCad library exporter"
readme = "README.md"
license-file = "LICENSE"
repository = "https://github.com/ref42/npnp"
documentation = "https://docs.rs/npnp"
keywords = ["altium", "easyeda", "lcsc", "eda", "kicad"]
categories = ["command-line-utilities"]
include = [
    "Cargo.lock",
    "Cargo.toml",
    "README.md",
    "README.en.md",
    "LICENSE",
    "assets/**",
    "imgs/**",
    "src/**",
    "tests/**",
]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

[lib]
name = "npnp"
path = "src/lib.rs"

[[bin]]
name = "npnp"
path = "src/main.rs"

[dependencies]
encoding_rs = "0.8.42"
cfb = "0.15.0"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
indicatif = "0.18.6"
log = "0.4.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "stream", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
