name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.asset_suffix }}
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
      CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_suffix: windows-x86_64
            binary: npnp.exe
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_suffix: linux-x86_64
            binary: npnp
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_suffix: linux-aarch64
            binary: npnp
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset_suffix: macos-x86_64
            binary: npnp
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            asset_suffix: macos-aarch64
            binary: npnp
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run tests
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} --bin npnp

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $name = "npnp-$tag-${{ matrix.asset_suffix }}"
          New-Item -ItemType Directory -Path "dist\$name" -Force
          Copy-Item "target\${{ matrix.target }}\release\${{ matrix.binary }}" "dist\$name\"
          Copy-Item README.md, LICENSE-APACHE "dist\$name\"
          $asset = "$name.${{ matrix.archive }}"
          Compress-Archive -Path "dist\$name\*" -DestinationPath $asset -Force
          "ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          name="npnp-$tag-${{ matrix.asset_suffix }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/$name/"
          cp README.md LICENSE-APACHE "dist/$name/"
          asset="$name.${{ matrix.archive }}"
          tar -czf "$asset" -C dist "$name"
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: npnp-${{ env.RELEASE_TAG }}-${{ matrix.asset_suffix }}
          path: ${{ env.ASSET }}

  release:
    name: publish release assets
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release-assets/*
          generate_release_notes: true
